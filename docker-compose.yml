services:
  db:
    image: postgres:17
    container_name: mealwise-db
    environment:
      POSTGRES_USER: mealwise
      POSTGRES_PASSWORD: mealwise
      POSTGRES_DB: mealwise
    ports:
      - "5433:5432"
    volumes:
      - mealwise-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mealwise -d mealwise"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  mealwise-pgdata:
